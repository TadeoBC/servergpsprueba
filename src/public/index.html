<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>atlyx GPS — flotilla</title>

  <!-- Leaflet por CDN: sin paso de compilación. Si el VPS no tiene salida a
       internet, descarga estos dos archivos y sírvelos desde /public. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="encabezado">
        <h1>atlyx <span class="marca">GPS</span></h1>
        <div class="espaciador"></div>
        <span class="pastilla" id="estado-ws">conectando…</span>
        <button class="btn pequeno" id="activar-notificaciones" type="button">Alertas</button>
        <button class="btn pequeno" id="alternar-panel" type="button" aria-label="Mostrar u ocultar el panel">▲</button>
        <button class="btn pequeno" id="salir" type="button">Salir</button>
      </div>

      <section class="seccion">
        <h2>Equipos (<span id="conteo">0</span>)</h2>
        <div id="lista"><div class="vacio">Cargando…</div></div>
        <details class="administrar-equipos">
          <summary>Agregar equipo por IMEI</summary>
          <form class="controles" id="form-equipo">
            <div><label for="nuevo-imei">IMEI (15 dígitos)</label><input id="nuevo-imei" inputmode="numeric" pattern="[0-9]{15}" minlength="15" maxlength="15" required placeholder="351840620204473" /></div>
            <div><label for="nuevo-alias">Alias</label><input id="nuevo-alias" maxlength="100" placeholder="Moto 2" /></div>
            <div><label for="nueva-placa">Placa</label><input id="nueva-placa" maxlength="30" placeholder="ABC-123" /></div>
            <button class="btn primario" type="submit">Agregar equipo</button>
            <div id="info-equipo" class="vacio" style="padding:0"></div>
          </form>
        </details>
      </section>

      <section class="seccion" id="seccion-detalle" hidden>
        <h2>Detalle</h2>
        <div class="detalle" id="detalle"></div>
        <div class="controles">
          <div><label for="limite-velocidad">Alerta de velocidad (km/h)</label><input type="number" id="limite-velocidad" min="1" max="300" placeholder="Sin límite" /></div>
          <div><label for="intervalo-reporte">Intervalo deseado (segundos)</label><input type="number" id="intervalo-reporte" min="10" max="86400" placeholder="Sin configurar" /></div>
          <button class="btn" id="guardar-ajustes" type="button">Guardar ajustes</button>
          <button class="btn primario" id="aplicar-intervalo" type="button">Aplicar intervalo al GPS</button>
          <button class="btn peligro" id="quitar-equipo" type="button">Quitar equipo de la flotilla</button>
          <div id="info-ajustes" class="vacio" style="padding:0"></div>
        </div>
        <div class="controles comandos">
          <label>Comandos seguros S11L</label>
          <div class="botonera">
            <button class="btn pequeno" id="consultar-estado" type="button">Consultar estado</button>
            <button class="btn pequeno" id="consultar-parametros" type="button">Consultar parámetros</button>
          </div>
          <div><label for="modo-alarma">Canal de alarma</label><select id="modo-alarma"><option value="0">Solo GPRS</option><option value="1">SMS + GPRS</option><option value="2">GPRS + SMS + llamada</option><option value="3">GPRS + llamada</option></select></div>
          <div class="botonera">
            <button class="btn pequeno" id="vibracion-on" type="button">Vibración ON</button>
            <button class="btn pequeno" id="vibracion-off" type="button">Vibración OFF</button>
            <button class="btn pequeno" id="bateria-on" type="button">Batería baja ON</button>
            <button class="btn pequeno" id="bateria-off" type="button">Batería baja OFF</button>
          </div>
          <div id="historial-comandos" class="vacio" style="padding:0">Sin comandos.</div>
        </div>
      </section>

      <section class="seccion">
        <h2>Recorrido</h2>
        <div class="controles">
          <div class="atajos">
            <button class="btn pequeno" data-rango="1">1 h</button>
            <button class="btn pequeno" data-rango="6">6 h</button>
            <button class="btn pequeno" data-rango="24">24 h</button>
            <button class="btn pequeno" data-rango="168">7 días</button>
          </div>
          <div>
            <label for="desde">Desde</label>
            <input type="datetime-local" id="desde" />
          </div>
          <div>
            <label for="hasta">Hasta</label>
            <input type="datetime-local" id="hasta" />
          </div>
          <div class="botonera">
            <button class="btn primario" id="cargar-recorrido" type="button">Cargar recorrido</button>
            <button class="btn" id="limpiar-recorrido" type="button">Limpiar</button>
          </div>
          <label class="check-fila"><input type="checkbox" id="ajustar-calles" checked /> Ajustar estela a calles</label>
          <div id="info-recorrido" class="vacio" style="padding:0"></div>
        </div>
      </section>

      <details class="depuracion">
        <summary>Integración API</summary>
        <div class="cuerpo controles">
          <div><label for="api-key-name">Nombre de la integración</label><input id="api-key-name" placeholder="Mi sistema" /></div>
          <button class="btn" id="generar-api-key" type="button">Generar clave API</button>
          <div id="api-key-result" class="vacio" style="padding:0">La clave secreta se muestra una sola vez.</div>
        </div>
      </details>

      <details class="depuracion" id="depuracion">
        <summary>Panel de depuración</summary>
        <div class="cuerpo" id="cuerpo-depuracion">
          <div class="vacio" style="padding:0">Selecciona un equipo para ver su último paquete.</div>
        </div>
      </details>
    </aside>

    <main id="area-mapas">
      <div class="barra-mapa" aria-label="Controles de seguimiento">
        <select id="tema-mapa" aria-label="Tema del mapa">
          <option value="calles">Calles</option>
          <option value="oscuro">Oscuro</option>
          <option value="satelite">Satélite</option>
        </select>
        <button class="btn pequeno" id="seguir-gps" type="button" aria-pressed="false">◎ Seguir</button>
        <button class="btn pequeno" id="vista-3d" type="button" aria-pressed="false">◩ Vista 3D</button>
        <button class="btn pequeno" id="vista-mosaico" type="button" aria-pressed="false">▦ Mosaico</button>
      </div>
      <div id="mapa" class="superficie-mapa"></div>
      <div id="mapa-3d" class="superficie-mapa" hidden></div>
      <div id="mosaico" class="superficie-mapa mosaico" hidden></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="/app.js"></script>
</body>
</html>
