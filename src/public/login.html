<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ACCESO — ATLYX_GPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Chakra+Petch:wght@600;700&display=swap" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login">
  <div class="hud-fondo" aria-hidden="true"></div>

  <form class="login-caja" id="form">
    <h1>ATLYX_GPS</h1>
    <p class="sub">Control de flotilla · acceso restringido</p>

    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button class="btn primario" type="submit">ENTRAR</button>
    <div class="login-error" id="error" role="alert"></div>
  </form>

  <script>
    const form = document.getElementById('form');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const boton = form.querySelector('button');
      boton.disabled = true;
      boton.textContent = 'VERIFICANDO…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: document.getElementById('usuario').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          location.href = '/';
          return;
        }
        error.textContent = data.error || 'No se pudo entrar';
      } catch (err) {
        error.textContent = 'Error de red: ' + err.message;
      } finally {
        boton.disabled = false;
        boton.textContent = 'ENTRAR';
      }
    });
  </script>
</body>
</html>
